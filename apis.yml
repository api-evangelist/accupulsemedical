aid: accupulsemedical
name: AccuPulse Medical Technology Co., Ltd.
description: >-
  AccuPulse Medical Technology Co., Ltd. (Suzhou AccuPulse, 艾科脉) is a cardiac electrophysiology
  medical device company in Suzhou Industrial Park, Jiangsu, China, founded in November 2020 to
  treat atrial fibrillation with non-thermal ablation. It is developing a pulsed electric field
  ablation (PFA) system — the AccuBlator generator and AccuPulse catheter — using high-voltage
  fields to induce irreversible electroporation in endocardial cells instead of the thermal injury
  caused by radiofrequency and cryoablation, plus Accu-System, a 3D cardiac electroanatomic mapping
  and navigation platform with magnetic/electrical localization and high-channel intracardiac EGM
  acquisition. The founding team came out of Johnson & Johnson, GE,
  Abbott, Acutus Medical and MicroPort, with R&D in China and the United States. AccuPulse sells
  regulated devices to hospitals; it runs no developer program and publishes no public API, SDK or
  machine-readable API contract on any host it controls.
